name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  windows:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg archives
        uses: actions/cache@v4
        with:
          path: ${{ env.LOCALAPPDATA }}\vcpkg\archives
          key: vcpkg-sdl3-windows

      - name: Cache FetchContent deps (libcinepak/libindeo3)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: windows-deps-${{ hashFiles('CMakeLists.txt') }}

      - name: Install SDL3 via vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg C:/vcpkg
          C:/vcpkg/bootstrap-vcpkg.bat
          C:/vcpkg/vcpkg.exe install sdl3:x64-windows

      - name: Configure
        run: >
          cmake -S . -B build -G "Visual Studio 18 2026" -A x64
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build build --target openfear --config Release

      - uses: actions/upload-artifact@v4
        with:
          name: openfear-windows
          path: |
            build/bin/Release/openfear.exe
            build/bin/Release/SDL3.dll
            build/bin/Release/Install.bat
            build/bin/Release/Uninstall.bat

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache FetchContent deps (SDL3/libcinepak/libindeo3)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: linux-deps-${{ hashFiles('CMakeLists.txt') }}

      - name: Install build + SDL3 system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            autoconf autoconf-archive automake libtool bison flex \
            libx11-dev libxft-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxss-dev libxfixes-dev libxtst-dev libwayland-dev libxkbcommon-dev \
            libegl1-mesa-dev libgl1-mesa-dev libibus-1.0-dev libasound2-dev libpulse-dev

      - name: Configure
        run: cmake -S . -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --target openfear

      - uses: actions/upload-artifact@v4
        with:
          name: openfear-linux
          path: build/bin/openfear

  macos:
    # 1 runner, both architectures built sequentially (CMAKE_OSX_ARCHITECTURES
    # + matching vcpkg triplet per arch, into separate build dirs) then lipo'd
    # into the 1 universal binary actually distributed - avoids 3 separate
    # waits for the scarcer macos-latest runner queue.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-sdl3-macos

      - name: Cache FetchContent deps (libcinepak/libindeo3)
        uses: actions/cache@v4
        with:
          path: |
            build-arm64/_deps
            build-x64/_deps
          key: macos-deps-${{ hashFiles('CMakeLists.txt') }}

      - name: Install SDL3 via vcpkg (both architectures)
        run: |
          git clone https://github.com/microsoft/vcpkg /tmp/vcpkg
          /tmp/vcpkg/bootstrap-vcpkg.sh
          /tmp/vcpkg/vcpkg install sdl3:arm64-osx sdl3:x64-osx

      - name: Configure + build (arm64)
        run: >
          cmake -S . -B build-arm64 -G "Unix Makefiles"
          -DCMAKE_TOOLCHAIN_FILE=/tmp/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=arm64-osx
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-arm64 --target openfear

      - name: Configure + build (x64)
        run: >
          cmake -S . -B build-x64 -G "Unix Makefiles"
          -DCMAKE_TOOLCHAIN_FILE=/tmp/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-osx
          -DCMAKE_OSX_ARCHITECTURES=x86_64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15
          -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-x64 --target openfear

      - name: Combine into a universal .app via lipo
        run: |
          mkdir dist
          cp -R build-arm64/bin/OpenFear.app dist/OpenFear.app
          cp -R "build-arm64/bin/Install OpenFear.app" "dist/Install OpenFear.app"
          cp -R "build-arm64/bin/Uninstall OpenFear.app" "dist/Uninstall OpenFear.app"
          lipo -create \
            build-arm64/bin/OpenFear.app/Contents/MacOS/openfear \
            build-x64/bin/OpenFear.app/Contents/MacOS/openfear \
            -output dist/OpenFear.app/Contents/MacOS/openfear
          lipo -info dist/OpenFear.app/Contents/MacOS/openfear

      - uses: actions/upload-artifact@v4
        with:
          name: openfear-macos
          # Parent dir, not OpenFear.app itself - a single-dir path becomes
          # the artifact root, dropping that dir's own name from the result.
          path: dist

  ps2:
    runs-on: ubuntu-latest
    container: ghcr.io/ps2dev/ps2dev@sha256:bc2eb0ddcf3c83f8697d3b7da2a654dacaae4c862322b712884858d20daf74dc
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        # tar/zstd: Alpine's default BusyBox tar lacks the flags actions/cache
        # needs, silently failing to save the cache with no error in the job
        # log - this pulls in real GNU tar + zstd instead.
        run: apk add --no-cache cmake make g++ git tar zstd

      - name: Cache FetchContent deps (SDL3/libcinepak/libindeo3)
        uses: actions/cache@v4
        with:
          path: build-ps2/_deps
          key: ps2-deps-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: >
          cmake -S . -B build-ps2 -G "Unix Makefiles"
          -DCMAKE_TOOLCHAIN_FILE=$PS2DEV/share/ps2dev.cmake
          -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build-ps2 --target openfear

      - uses: actions/upload-artifact@v4
        with:
          name: openfear-ps2
          path: build-ps2/bin/openfear.elf

  web:
    runs-on: ubuntu-latest
    container: emscripten/emsdk@sha256:6bd7aef93408b10bf7b36642cb7c91119b302f720b9ec2d20439f73cf07fe894
    steps:
      - uses: actions/checkout@v4

      - name: Cache FetchContent deps (SDL3/libcinepak/libindeo3)
        uses: actions/cache@v4
        with:
          path: build-web/_deps
          key: web-deps-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-web --target openfear

      - uses: actions/upload-artifact@v4
        with:
          name: openfear-web
          path: build-web/bin/

  release:
    needs: [windows, linux, macos, ps2]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: openfear-windows
          path: artifacts/openfear-windows
      - uses: actions/download-artifact@v4
        with:
          name: openfear-linux
          path: artifacts/openfear-linux
      - uses: actions/download-artifact@v4
        with:
          name: openfear-macos
          path: artifacts/openfear-macos
      - uses: actions/download-artifact@v4
        with:
          name: openfear-ps2
          path: artifacts/openfear-ps2

      # actions/upload-artifact strips Unix permissions (every file round-trips
      # as 644, actions/upload-artifact#38) - restoring +x on the binaries here.
      - name: Restore executable permissions lost by the artifact round-trip
        run: |
          chmod +x artifacts/openfear-linux/openfear
          chmod +x artifacts/openfear-macos/OpenFear.app/Contents/MacOS/openfear
          chmod +x "artifacts/openfear-macos/Install OpenFear.app/Contents/MacOS/droplet"
          chmod +x "artifacts/openfear-macos/Uninstall OpenFear.app/Contents/MacOS/applet"

      - name: Add per-platform README + LICENSE to each zip's contents
        run: |
          for plat in windows linux macos ps2; do
            cp "packaging/${plat}/README.txt" "artifacts/openfear-${plat}/README.txt"
            cp LICENSE "artifacts/openfear-${plat}/LICENSE.txt"
          done

      - name: Package per-platform zips
        # -j flattens loose binaries fine, but destroys a bundle's tree -
        # detect that structurally (nested dir present) instead of by name.
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            if find "$dir" -mindepth 1 -maxdepth 1 -type d | grep -q .; then
              (cd "$dir" && zip -r "../../${name}.zip" .)
            else
              zip -r -j "../${name}.zip" "$dir"
            fi
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"

  deploy-web:
    needs: [web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: openfear-web
          path: web-dist

      # Cloudflare Pages serves index.html as the site root; the CMake
      # target's own output name (openfear.html, matching the other
      # platform binaries) stays as-is for local testing.
      - name: Rename entry point for Pages
        run: cp web-dist/openfear.html web-dist/index.html

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web-dist --project-name=openfear
